name: CI

on:
  push:
    branches:
      - main
      - claude/scaffold-excel-ai-addin-tOGcT
  pull_request:

jobs:
  web-tests:
    name: Smart Excel unit + e2e tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-excel-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: smart-excel-ai/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Browser e2e tests
        run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Production build
        run: npm run build

  backend-typecheck:
    name: Backend and add-in type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies
        run: npm install
      - name: Type-check backend
        run: npx tsc --noEmit -p backend/tsconfig.json
